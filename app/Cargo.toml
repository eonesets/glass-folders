[package]
name = "glass-folders"
version = "1.0.0"
edition = "2021"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Imaging",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
slint-build = "1"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
