<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Folders — макет v2 (Мика)</title>
<!-- Mockup v2. Style: Mica (chosen 2026-11-22). Icons = placeholders; real app extracts real icons. -->
<style>
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --r:8px; --r-lg:12px;
  --cell:76px; --gap:8px; --head:26px; --icon:48px;
  --txt:#fff; --txt2:rgba(255,255,255,.72); --txt3:rgba(255,255,255,.5);
  --glass:rgba(32,32,36,.62); --glass-strong:rgba(28,28,32,.80);
  --card:rgba(255,255,255,.06); --card-h:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.09); --stroke2:rgba(255,255,255,.16);
  --shadow:0 32px 64px rgba(0,0,0,.45),0 2px 21px rgba(0,0,0,.3);
  --accent:#60cdff;
  --wall:radial-gradient(1200px 700px at 15% 20%,#2b4f8f 0%,transparent 60%),radial-gradient(900px 600px at 85% 75%,#7a2d6b 0%,transparent 60%),radial-gradient(700px 500px at 60% 10%,#1d7a6e 0%,transparent 60%),#0d1220;
}
:root[data-theme="light"]{
  --txt:#1a1a1a; --txt2:rgba(0,0,0,.66); --txt3:rgba(0,0,0,.45);
  --glass:rgba(243,243,246,.62); --glass-strong:rgba(246,246,248,.82);
  --card:rgba(255,255,255,.5); --card-h:rgba(255,255,255,.75);
  --stroke:rgba(0,0,0,.07); --stroke2:rgba(0,0,0,.12);
  --shadow:0 32px 64px rgba(0,0,0,.18),0 2px 21px rgba(0,0,0,.1);
  --accent:#005fb8;
  --wall:radial-gradient(1200px 700px at 15% 20%,#9cc3ff 0%,transparent 60%),radial-gradient(900px 600px at 85% 75%,#f3b3dc 0%,transparent 60%),radial-gradient(700px 500px at 60% 10%,#a6ead9 0%,transparent 60%),#e8ecf4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--txt);background:var(--wall);background-attachment:fixed;overflow:hidden;user-select:none}
.noise::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

/* mockup controls (not part of the app) */
.switch{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--stroke);backdrop-filter:blur(30px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.switch button{font:inherit;font-size:13px;color:var(--txt2);background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
.switch button.on{background:var(--card-h);color:var(--txt)}
.hint{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--txt2);background:var(--glass);padding:6px 12px;border-radius:6px;backdrop-filter:blur(20px);border:1px solid var(--stroke);white-space:nowrap}

/* desktop */
.desk{position:absolute;inset:64px 24px 60px 24px;display:grid;grid-template-columns:repeat(auto-fill,88px);grid-auto-rows:88px;gap:24px 16px;align-content:start}
.tile{position:relative;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(40px) saturate(1.4);box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;transition:transform .12s,background .12s}
.tile:hover{background:var(--glass-strong)}
.tile:active{transform:scale(.97)}
.tile .lbl{position:absolute;left:-8px;right:-8px;bottom:-20px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-theme="light"] .tile .lbl{color:#111;text-shadow:0 1px 2px rgba(255,255,255,.8)}
/* 1 desktop cell (88px) = 2x2 icons; slot step = 44px everywhere, also across the 24px/16px cell gaps */
.tile .mini{position:absolute;inset:10px;display:grid;gap:8px;justify-items:center;align-items:center}
.tile .mini .ic{height:100%;max-height:30px;font-size:10px;border-radius:22%}
.tile .mini .ic.more{background:var(--card-h);color:var(--txt);box-shadow:none}
.tile .lbl .tdot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}

/* icon: always square */
.ic{display:grid;place-items:center;aspect-ratio:1;border-radius:22%;font-weight:600;color:#fff;letter-spacing:-.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.25);flex:none}

/* popup */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;left:50%;top:50%;z-index:30;transform:translate(-50%,-48%) scale(.96);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.1,.9,.2,1),opacity .15s;
  border-radius:var(--r-lg);background:var(--glass-strong);border:1px solid var(--stroke2);backdrop-filter:blur(60px) saturate(1.5);box-shadow:var(--shadow);max-width:calc(100vw - 48px);max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.panel.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.phead h2{margin:0;font-size:15px;font-weight:600}
.phead .count{font-size:12px;color:var(--txt3)}
.phead .sp{flex:1}
.search{font:inherit;font-size:13px;color:var(--txt);width:160px;padding:5px 10px;border-radius:6px;border:1px solid var(--stroke);border-bottom-color:var(--stroke2);background:var(--card);outline:none}
.search::placeholder{color:var(--txt3)}
.btn{font:inherit;font-size:12px;color:var(--txt);background:var(--card);border:1px solid var(--stroke);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--card-h)}
.btn.on{background:var(--accent);color:#000;border-color:transparent}
:root[data-theme="light"] .btn.on{color:#fff}
.pbody{padding:4px 16px 16px;overflow:auto}

/*
 Folder grid. Every slot is a square cell (--cell). A group of w x h holds exactly w*h slots.
 Group height = head + h*cell, so groups with equal h line up. Rows: auto-sized, dense packing.
*/
.fgrid{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));gap:var(--gap);grid-auto-flow:row dense;
  grid-auto-rows:auto}
.group{min-height:calc(var(--head) + var(--gh) * var(--cell) + 4px)}
.group{position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--stroke);display:flex;flex-direction:column;overflow:hidden}
.ghead{display:flex;align-items:center;gap:6px;height:var(--head);flex:none;padding:0 10px;font-size:12px;font-weight:600;color:var(--txt2);white-space:nowrap}
.ghead .dot{width:8px;height:8px;border-radius:2px;flex:none}
.ghead .name{overflow:hidden;text-overflow:ellipsis}
.ghead .n{margin-left:auto;font-weight:400;color:var(--txt3)}
.narrow .ghead{padding:0 7px;gap:5px}
.narrow .ghead .n{display:none}
.gitems{flex:1;display:grid;grid-template-columns:repeat(var(--w),1fr);grid-template-rows:repeat(var(--h),1fr);justify-items:center;align-items:center;padding:0 2px 4px}
.app{width:calc(var(--cell) - 6px);height:calc(var(--cell) - 10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;cursor:pointer}
.app:hover{background:var(--card-h)}
.app .ic{width:var(--icon);font-size:14px}
.app span{font-size:10.5px;color:var(--txt2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.nolabels{--icon:54px}
.nolabels .app span{display:none}
.app.more .ic{background:var(--card-h)!important;color:var(--txt);font-size:15px}
.app.off{opacity:.2}

/* edit mode */
.handle{display:none;position:absolute;right:3px;bottom:3px;width:14px;height:14px;cursor:nwse-resize;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);border-radius:0 0 4px 0}
.editing .handle{display:block}
.editing .group{outline:1px dashed var(--accent);outline-offset:-1px}
.editing .app{animation:jig .3s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
/* color: click the dot itself -> small popover */
.dot.pick{cursor:pointer;transition:transform .1s,box-shadow .1s}
.dot.pick:hover{transform:scale(1.35);box-shadow:0 0 0 2px var(--stroke2)}
.pop{position:fixed;z-index:60;display:none;grid-template-columns:repeat(5,18px);gap:6px;padding:8px;border-radius:var(--r);background:var(--glass-strong);border:1px solid var(--stroke2);backdrop-filter:blur(40px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pop.show{display:grid}
.pop i{width:18px;height:18px;border-radius:4px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.pop i:hover{transform:scale(1.15)}
.pop i.cur{outline:2px solid var(--txt);outline-offset:1px}
.sizeTag{display:none;position:absolute;right:20px;bottom:4px;font-size:10px;color:var(--accent)}
.editing .sizeTag{display:block}

.taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--glass-strong);backdrop-filter:blur(40px);border-top:1px solid var(--stroke);display:flex;justify-content:center;align-items:center;gap:6px}
.taskbar b{width:32px;height:32px;border-radius:6px;background:var(--card)}
</style>
</head>
<body>

<div class="switch">
  <button id="labelsBtn" class="on">Подписи</button>
  <button id="themeBtn">Тема</button>
</div>

<div class="desk" id="desk"></div>
<div class="hint">Нажми на папку. «Изменить» → тяни уголок группы, меняй цвет.</div>
<div class="taskbar"><b></b><b></b><b></b><b></b><b></b></div>

<div class="pop" id="pop"></div>
<div class="scrim" id="scrim"></div>
<div class="panel noise" id="panel">
  <div class="phead">
    <span class="dot pick" id="fdot" title="Цвет папки" style="width:10px;height:10px;border-radius:3px"></span><h2 id="ptitle"></h2><span class="count" id="pcount"></span>
    <span class="sp"></span>
    <input class="search" id="search" placeholder="Поиск">
    <button class="btn" id="editBtn">Изменить</button>
  </div>
  <div class="pbody"><div class="fgrid" id="fgrid"></div></div>
</div>

<script>
const PAL=['#e74856','#f7630c','#ffb900','#16c60c','#00b7c3','#0078d4','#8764b8','#e3008c','#498205','#c239b3'];
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const abbr=s=>s.replace(/[^A-Za-zА-Яа-я0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const icon=n=>`<div class="ic" style="background:linear-gradient(145deg,${hue(n)},color-mix(in srgb,${hue(n)} 60%,#000))">${abbr(n)}</div>`;

// smallest w x h (w>=h, w<=maxW) that fits n with least empty slots
function autoSize(n,maxW){let best=null;for(let h=1;h<=n;h++)for(let w=h;w<=maxW;w++){if(w*h<n)continue;const waste=w*h-n,score=waste*10+Math.abs(w-h*2);if(!best||score<best.s)best={w,h,s:score}}return best||{w:maxW,h:Math.ceil(n/maxW)}}

// real shortcuts from Desktop after cleanup (2026-11-22). Names = short, like on phones.
const FOLDERS={
 games:{title:'Игры',color:'#16c60c',cols:7,groups:[
  {name:'Лаунчеры',color:'#0078d4',w:4,h:2,items:['Steam','Epic','Battle.net','Riot','Game Center','HoYoPlay','Paradox','TLauncher']},
  {name:'Шутеры',color:'#e74856',w:2,h:2,items:['VALORANT','THE FINALS','Squad','WoT']},
  {name:'Разное',color:'#00b7c3',w:1,h:2,items:['Discord','Wallpaper']},
  {name:'Стратегии',color:'#ffb900',w:3,h:2,items:['Cities','RimWorld','KSP','Zomboid','Spore','Noita']},
  {name:'Сюжетные',color:'#8764b8',w:4,h:2,items:['Ведьмак 3','DQ XI','DREDGE','Orwell','VotV']},
 ]},
 soft:{title:'Софт',color:'#0078d4',cols:7,groups:[
  {name:'Творчество',color:'#e3008c',w:3,h:2,items:['Blender','Aseprite','GIMP','Paint.NET','Plasticity','CapCut']},
  {name:'Музыка',color:'#f7630c',w:4,h:2,items:['FL Studio','Serum','ASIO4ALL','MultiRack','SoundGrid','GTR 3.5','PRS V9','Element']},
  {name:'Железо',color:'#e74856',w:3,h:3,items:['NVIDIA','Afterburner','AIDA64','CrystalDisk','NZXT CAM','G HUB','SignalRgb','RGBFusion','UserBench']},
  {name:'Браузеры',color:'#0078d4',w:2,h:3,items:['Chrome','Arc','Edge','Tor','Telegram','Moonlight']},
  {name:'Утилиты',color:'#8764b8',w:2,h:3,items:['Anki','NordVPN','Malwarebytes','BitTorrent','Unity Hub','VirtualBox']},
 ]},
 code:{title:'Кодинг',color:'#00b7c3',cols:4,groups:[
  {name:'Кодинг',color:'#00b7c3',items:['Obsidian','VS Code','Antigravity','AI Hub']},
 ]},
};
for(const f of Object.values(FOLDERS))for(const g of f.groups)if(!g.w){Object.assign(g,autoSize(g.items.length,f.cols))}

// desktop
const desk=document.getElementById('desk');
// rule: 1 desktop cell = 2x2 icons. Tile w x h -> (2w) x (2h) icon slots, same everywhere.
// big tile: icons launch directly; if apps don't fit, last slot = "+N" (opens folder).
function folderTile(key,w,h){
  const f=FOLDERS[key],all=f.groups.flatMap(g=>g.items),big=w>1||h>1;
  const cols=2*w,rows=2*h,cap=cols*rows,over=all.length>cap;
  const shown=over? all.slice(0,cap-1):all;
  const t=document.createElement('div');
  t.className='tile noise'+(big?' big':'');
  t.style.gridColumn=`span ${w}`;t.style.gridRow=`span ${h}`;
  t.innerHTML=`<div class="mini" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${shown.map(icon).join('')}${over?`<div class="ic more">+${all.length-cap+1}</div>`:''}</div><div class="lbl"><span class="tdot" style="background:${f.color}"></span>${f.title}</div>`;
  t.onclick=e=>{const ic=e.target.closest('.ic');if(big&&ic&&!ic.classList.contains('more')){flash(ic);return}openFolder(key)};
  f.tile=t;desk.appendChild(t);
}
function flash(el){el.animate([{transform:'scale(1)'},{transform:'scale(.85)'},{transform:'scale(1)'}],{duration:220})}
folderTile('games',3,2);
folderTile('soft',1,1);
folderTile('code',1,1);

// panel
const panel=document.getElementById('panel'),scrim=document.getElementById('scrim'),grid=document.getElementById('fgrid');
let cur=null;
function openFolder(key){cur=key;render();panel.classList.add('show');scrim.classList.add('show');document.getElementById('search').value=''}
function close(){panel.classList.remove('show','editing');scrim.classList.remove('show');document.getElementById('editBtn').classList.remove('on')}
scrim.onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

// one app per square slot; if group too small -> last slot shows "+N"
function fill(el,g){
  const cap=g.w*g.h, over=g.items.length>cap;
  const shown=over? g.items.slice(0,cap-1) : g.items;
  // group spans h rows of cells + header (header eats half of a row-track per row unit: rows tracks are cell+gap/2)
  el.style.gridColumn=`span ${g.w}`;el.classList.toggle('narrow',g.w===1);
  el.style.gridRow=`span ${g.h}`;el.style.setProperty('--gh',g.h);
  const gi=el.querySelector('.gitems');gi.style.setProperty('--w',g.w);gi.style.setProperty('--h',g.h);
  gi.innerHTML=shown.map(n=>`<div class="app" data-n="${n.toLowerCase()}">${icon(n)}<span>${n}</span></div>`).join('')+
    (over?`<div class="app more"><div class="ic">+${g.items.length-cap+1}</div><span>ещё</span></div>`:'');
  el.querySelector('.sizeTag').textContent=`${g.w}×${g.h}`;
  gi.querySelectorAll('.app:not(.more)').forEach(a=>a.onclick=()=>{if(panel.classList.contains('editing'))return;flash(a.firstChild);setTimeout(close,200)});
}
function render(){
  const f=FOLDERS[cur];
  document.getElementById('ptitle').textContent=f.title;
  const fd=document.getElementById('fdot');fd.style.background=f.color;
  fd.onclick=e=>{e.stopPropagation();openPicker(fd,f.color,c=>{f.color=c;fd.style.background=c;f.tile.querySelector('.tdot').style.background=c})};
  document.getElementById('pcount').textContent=f.groups.reduce((a,g)=>a+g.items.length,0)+' приложений';
  grid.style.setProperty('--cols',f.cols);
  grid.innerHTML='';
  f.groups.forEach(g=>{
    const el=document.createElement('div');el.className='group noise';
    el.innerHTML=`<div class="ghead"><span class="dot pick" title="Цвет группы" style="background:${g.color}"></span><span class="name">${g.name}</span><span class="n">${g.items.length}</span></div><div class="gitems"></div><div class="sizeTag"></div><div class="handle"></div>`;
    const dot=el.querySelector('.dot');
    dot.onclick=e=>{e.stopPropagation();openPicker(dot,g.color,c=>{g.color=c;dot.style.background=c})};
    el.querySelector('.handle').onpointerdown=e=>resizeStart(e,g,el);
    fill(el,g);grid.appendChild(el);
  });
}
// color popover: opens under the clicked dot, closes on pick / outside click
const pop=document.getElementById('pop');let popCb=null;
pop.innerHTML=PAL.map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join('');
pop.onclick=e=>{const i=e.target.closest('i');if(!i)return;e.stopPropagation();popCb&&popCb(i.dataset.c);pop.classList.remove('show')};
function openPicker(anchor,curColor,cb){
  popCb=cb;const r=anchor.getBoundingClientRect();
  pop.querySelectorAll('i').forEach(i=>i.classList.toggle('cur',i.dataset.c===curColor));
  pop.style.left=Math.min(r.left-6,innerWidth-140)+'px';pop.style.top=(r.bottom+8)+'px';pop.classList.add('show');
}
document.addEventListener('pointerdown',e=>{if(!pop.contains(e.target)&&!e.target.classList.contains('pick'))pop.classList.remove('show')});

function resizeStart(e,g,el){
  e.preventDefault();
  const cs=getComputedStyle(document.documentElement),step=parseFloat(cs.getPropertyValue('--cell'))+parseFloat(cs.getPropertyValue('--gap'));
  const sx=e.clientX,sy=e.clientY,w0=g.w,h0=g.h,f=FOLDERS[cur];
  const mv=ev=>{const w=Math.max(1,Math.min(f.cols,w0+Math.round((ev.clientX-sx)/step)));const h=Math.max(1,Math.min(6,h0+Math.round((ev.clientY-sy)/step)));
    if(w!==g.w||h!==g.h){g.w=w;g.h=h;fill(el,g)}};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
document.getElementById('editBtn').onclick=e=>{panel.classList.toggle('editing');e.target.classList.toggle('on')};
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();grid.querySelectorAll('.app[data-n]').forEach(a=>a.classList.toggle('off',!!q&&!a.dataset.n.includes(q)))};
document.getElementById('labelsBtn').onclick=e=>{document.body.classList.toggle('nolabels');e.target.classList.toggle('on')};
const mq=matchMedia('(prefers-color-scheme: light)');
document.documentElement.dataset.theme=mq.matches?'light':'dark';
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
openFolder('games');
</script>
</body>
</html>
